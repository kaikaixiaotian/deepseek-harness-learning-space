# dsh-client-ui-learning bundle layer: inserts the client-side learning UI row
# (turn-tail open cards + the full-screen learning space overlay; the browser
# half is discovered through the package's `dsh.client` declaration). Patch
# layers are id-targeted, so a NEW row must be inserted via `- insert:`.
# Installed via `dsh plugin --profile <name> add`.
- insert:
    - id: ui-learning
      name: 'dsh-client-ui-learning'
