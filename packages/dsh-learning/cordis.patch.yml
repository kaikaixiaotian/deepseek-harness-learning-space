# dsh-learning bundle layer: inserts the host-side learning Remote service
# row (namespace 'learning'). Patch layers are id-targeted, so a NEW row must
# be inserted via `- insert:` (plain `- id:` would target an existing row).
# Installed via `dsh plugin --profile <name> add`.
- insert:
    - id: learning
      name: 'dsh-learning'
